<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Investissement</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Investissement" />
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #f5f5f4; --card: #ffffff; --border: #e5e5e5;
    --text: #111111; --text-2: #666666; --accent: #378ADD;
    --green: #0f6e56; --red: #a32d2d; --amber: #a05a00; --purple: #6457a6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1a; --card: #262624; --border: #3a3a38; --text: #f0f0ee; --text-2: #a0a09a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,sans-serif; padding-bottom:2rem; }
  .wrap { max-width:480px; margin:0 auto; padding:1rem; }
  .tabs { display:flex; gap:8px; margin-bottom:1rem; position:sticky; top:0; background:var(--bg); padding-top:0.5rem; z-index:10; }
  .tab { flex:1; padding:10px 4px; text-align:center; border:0.5px solid var(--border); border-radius:10px; font-size:12px; background:transparent; color:var(--text-2); cursor:pointer; }
  .tab.active { background:var(--card); color:var(--text); font-weight:600; }
  .card { background:var(--card); border:0.5px solid var(--border); border-radius:12px; padding:1rem 1.1rem; margin-bottom:12px; }
  .card.muted { background:var(--bg); }
  .hero { background:linear-gradient(135deg, #15243d, #224d70); color:#fff; border:0; padding:1.25rem; }
  .hero .muted-text { color:#d6e6f5; }
  input, textarea, button { width:100%; font-size:14px; padding:8px 10px; border-radius:8px; border:0.5px solid var(--border); background:var(--bg); color:var(--text); margin-bottom:8px; font-family:inherit; }
  button { cursor:pointer; font-weight:600; background:var(--card); }
  button:active { transform:scale(0.98); }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .muted-text { color:var(--text-2); font-size:12px; }
  .green { color:var(--green); } .red { color:var(--red); }
  .score { font-size:40px; font-weight:700; text-align:center; margin:4px 0; }
  .bar-bg { height:6px; background:var(--bg); border-radius:3px; margin-top:4px; }
  .bar-fill { height:6px; background:var(--accent); border-radius:3px; }
  .del { border:none; background:none; color:var(--red); font-size:18px; padding:0; width:auto; }
  .pill { display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border-radius:999px; font-size:11px; font-weight:700; }
  .pill.buy { color:var(--green); background:#e5f4ed; } .pill.hold { color:#1e5d91; background:#e8f2fb; }
  .pill.watch { color:var(--amber); background:#fff0d6; } .pill.sell { color:var(--red); background:#fbe9e9; }
  .signal { padding:10px 0; border-bottom:0.5px solid var(--border); } .signal:last-child { border:0; padding-bottom:0; }
  .signal-title { font-size:14px; font-weight:700; }
  .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { padding:10px 8px; border-radius:10px; background:var(--bg); }
  .stat strong { display:block; font-size:16px; margin-top:2px; }
  .action { background:var(--accent); color:#fff; border-color:var(--accent); }
  .allocation { height:9px; border-radius:8px; overflow:hidden; display:flex; background:var(--bg); margin-top:7px; }
  .allocation > span { height:100%; min-width:2px; }
  h2 { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h2 id="sr-title">Outil d'aide à l'investissement : portfolio, analyse d'action et watchlist</h2>
  <div class="tabs">
    <button class="tab" data-tab="assistant">Assistant</button>
    <button class="tab" data-tab="portfolio">Portfolio</button>
    <button class="tab" data-tab="analyse">Analyse</button>
    <button class="tab" data-tab="watch">Watchlist</button>
    <button class="tab" data-tab="config">Config</button>
  </div>

  <div id="tab-assistant"></div>
  <div id="tab-portfolio"></div>
  <div id="tab-analyse" style="display:none"></div>
  <div id="tab-watch" style="display:none"></div>
  <div id="tab-config" style="display:none"></div>
  <datalist id="ticker-suggestions"></datalist>
</div>

<script>
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e) { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};

const TTL = { quote: 15*60*1000, series: 60*60*1000, rate: 60*60*1000, search: 10*60*1000 };
function cacheGet(key, ttl) {
  const c = store.get('cache_'+key, null);
  if (!c || Date.now()-c.t > ttl) return null;
  return c.v;
}
function cacheSet(key, v) { store.set('cache_'+key, { v, t: Date.now() }); }
function clearCache() { Object.keys(localStorage).filter(k=>k.startsWith('cache_')).forEach(k=>localStorage.removeItem(k)); }

let transactions = store.get('transactions', []);
let tickerMeta = store.get('tickerMeta', {});
let prices = store.get('prices', {});
let watchlist = store.get('watchlist', []);
let apiKey = store.get('apiKey', '');
let investorProfile = store.get('investorProfile', { risk: 'Équilibré', horizon: '5 ans', cash: 0 });

// Migration ponctuelle depuis l'ancien modèle "positions" (une ligne = une position)
(function migrate() {
  if (store.get('migratedToTx', false)) return;
  const oldPositions = store.get('positions', []);
  if (oldPositions.length) {
    oldPositions.forEach(p => {
      transactions.push({ id: p.id, ticker: p.ticker, type:'buy', qty: p.qty, price: p.pru, date: new Date().toISOString().slice(0,10), });
      tickerMeta[p.ticker] = { currency: p.currency || 'EUR' };
      prices[p.ticker] = p.prix;
    });
    store.set('transactions', transactions); store.set('tickerMeta', tickerMeta); store.set('prices', prices);
  }
  store.set('migratedToTx', true);
})();

// ---- Synchronisation multi-appareils (Firebase, optionnel) ----
let fbConfig = store.get('fbConfig', null);
let fbApp = null, fbAuth = null, fbDb = null, cloudUser = null, syncStatus = '';
let syncTimer = null;

function initFirebase() {
  if (!fbConfig || fbApp) return;
  try {
    fbApp = firebase.initializeApp(fbConfig);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbAuth.onAuthStateChanged((user) => {
      cloudUser = user;
      if (user) pullFromCloud();
      renderConfig();
    });
  } catch (e) { syncStatus = 'Configuration Firebase invalide : ' + e.message; }
}

function scheduleSync() {
  if (!cloudUser) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToCloud, 1500);
}

async function pushToCloud() {
  if (!cloudUser || !fbDb) return;
  syncStatus = 'Synchronisation…'; renderConfig();
  try {
    await fbDb.collection('users').doc(cloudUser.uid).set({
      transactions, tickerMeta, prices, watchlist, valueHistory, investorProfile,
      updatedAt: new Date().toISOString(),
    });
    syncStatus = 'Synchronisé à ' + new Date().toLocaleTimeString('fr-FR');
  } catch (e) { syncStatus = 'Échec de synchronisation : ' + e.message; }
  renderConfig();
}

async function pullFromCloud() {
  if (!cloudUser || !fbDb) return;
  syncStatus = 'Récupération des données…'; renderConfig();
  try {
    const doc = await fbDb.collection('users').doc(cloudUser.uid).get();
    if (doc.exists) {
      const d = doc.data();
      transactions = d.transactions || []; tickerMeta = d.tickerMeta || {}; prices = d.prices || {};
      watchlist = d.watchlist || []; valueHistory = d.valueHistory || []; investorProfile = d.investorProfile || investorProfile;
      store.set('transactions', transactions); store.set('tickerMeta', tickerMeta); store.set('prices', prices);
      store.set('watchlist', watchlist); store.set('valueHistory', valueHistory); store.set('investorProfile', investorProfile);
      renderPortfolio(); renderWatch(); renderAssistant();
      syncStatus = 'Données récupérées depuis le cloud.';
    } else {
      syncStatus = 'Aucune donnée cloud existante — vos données locales vont être envoyées.';
      pushToCloud();
    }
  } catch (e) { syncStatus = 'Échec de récupération : ' + e.message; }
  renderConfig();
}

window.saveFbConfig = () => {
  const raw = document.getElementById('fb-config').value.trim();
  try {
    const parsed = Function('"use strict"; return (' + raw + ')')();
    if (!parsed || !parsed.apiKey || !parsed.projectId) throw new Error('champs manquants');
    fbConfig = parsed;
    store.set('fbConfig', fbConfig);
    initFirebase();
    renderConfig();
  } catch (e) { alert('Configuration Firebase illisible — collez exactement l\'objet firebaseConfig (avec ses accolades) fourni par Firebase.'); }
};
window.cloudSignUp = () => {
  const email = document.getElementById('fb-email').value.trim(), pass = document.getElementById('fb-pass').value;
  if (!fbAuth) return;
  fbAuth.createUserWithEmailAndPassword(email, pass).catch(e => { syncStatus = e.message; renderConfig(); });
};
window.cloudSignIn = () => {
  const email = document.getElementById('fb-email').value.trim(), pass = document.getElementById('fb-pass').value;
  if (!fbAuth) return;
  fbAuth.signInWithEmailAndPassword(email, pass).catch(e => { syncStatus = e.message; renderConfig(); });
};
window.cloudSignOut = () => { if (fbAuth) fbAuth.signOut(); };

const fmt = (n, d=2) => Number.isFinite(n) ? n.toLocaleString('fr-FR', {minimumFractionDigits:d, maximumFractionDigits:d}) : '—';

// ---- indicateurs ----
function sma(arr, p) { const s = arr.slice(-p); return s.length ? s.reduce((a,b)=>a+b,0)/s.length : null; }
function ema(arr, p) { if (!arr.length) return []; const k = 2/(p+1); const out=[arr[0]]; for (let i=1;i<arr.length;i++) out.push(arr[i]*k + out[i-1]*(1-k)); return out; }
function rsi(arr, p=14) { if (arr.length < p+1) return null; const ch = arr.slice(1).map((v,i)=>v-arr[i]).slice(-p);
  const g = ch.filter(c=>c>0).reduce((a,b)=>a+b,0)/p; const l = -ch.filter(c=>c<0).reduce((a,b)=>a+b,0)/p;
  if (l===0) return 100; return 100 - 100/(1+g/l); }
function macd(arr) { if (arr.length<26) return null; const e12=ema(arr,12), e26=ema(arr,26);
  const line=e12.map((v,i)=>v-e26[i]); const sig=ema(line.slice(-Math.max(line.length-25,9)),9);
  const histSeries = sig.map((v,i)=> line[line.length-sig.length+i] - v).slice(-5);
  return { macd: line[line.length-1], signal: sig[sig.length-1], hist: histSeries[histSeries.length-1], histSeries }; }
function volat(arr) { if (arr.length<2) return null; const r = arr.slice(1).map((v,i)=>(v-arr[i])/arr[i]);
  const m = r.reduce((a,b)=>a+b,0)/r.length; const v = r.reduce((a,b)=>a+(b-m)**2,0)/r.length;
  return Math.sqrt(v)*Math.sqrt(252)*100; }
function momentum(arr, p=20) { if (arr.length<p+1) return null; const past=arr[arr.length-1-p], last=arr[arr.length-1]; return (last-past)/past*100; }

function perScore(per) {
  if (per===null || !Number.isFinite(per) || per<=0) return 6.5; // neutre si absent
  if (per < 15) return 13;
  if (per < 20) return 10;
  if (per < 25) return 8;
  if (per < 35) return 4;
  return 2;
}
function obv(closes, volumes) {
  if (!volumes || volumes.length !== closes.length || volumes.some(v=>!Number.isFinite(v))) return null;
  let o = 0; const series=[0];
  for (let i=1;i<closes.length;i++) {
    if (closes[i]>closes[i-1]) o += volumes[i];
    else if (closes[i]<closes[i-1]) o -= volumes[i];
    series.push(o);
  }
  return series;
}

function computeScore(arr, opts={}) {
  const { per=null, benchmarkArr=null, volumes=null } = opts;
  const last=arr[arr.length-1], s20=sma(arr,20), s50=sma(arr,50), r=rsi(arr,14), m=macd(arr), vol=volat(arr), mom=momentum(arr,20);
  let trend=0;
  if (s20 && s50) { if (last>s20 && s20>s50) trend=18; else if (last>s20||last>s50) trend=11; else if (last<s20&&s20<s50) trend=0; else trend=5; }
  else if (s20) trend = last>s20 ? 13 : 4;
  let rsiS=7;
  if (r!==null) { if (r>=45&&r<=65) rsiS=13; else if (r>65&&r<=75) rsiS=9; else if (r>=30&&r<45) rsiS=10; else if (r>75) rsiS=4; else rsiS=5; }
  let macdS=7, macdTrend=0;
  if (m) {
    if (m.hist>0&&m.macd>0) macdS=11; else if (m.hist>0) macdS=7; else if (m.hist<0&&m.macd<0) macdS=2; else macdS=5;
    if (m.histSeries && m.histSeries.length>=2) {
      macdTrend = m.histSeries[m.histSeries.length-1] - m.histSeries[0];
      macdS += macdTrend > 0 ? 2 : macdTrend < 0 ? -2 : 0;
      macdS = Math.max(0, Math.min(13, macdS));
    }
  }
  let momS = mom!==null ? Math.max(0,Math.min(13,6.5+mom*0.325)) : 6.5;
  let volS = vol!==null ? Math.max(0,Math.min(9,9-vol/6.67)) : 4.5;
  const perS = perScore(per);
  let relS = 4.5; // neutre si pas de benchmark
  let relMom = null;
  if (benchmarkArr && benchmarkArr.length>20) {
    const benchMom = momentum(benchmarkArr,20);
    if (mom!==null && benchMom!==null) {
      relMom = mom - benchMom;
      relS = Math.max(0, Math.min(9, 4.5 + relMom*0.27));
    }
  }
  const obvSeries = volumes ? obv(arr, volumes) : null;
  let obvTrend = null, obvS = 6;
  if (obvSeries && obvSeries.length>21) {
    obvTrend = obvSeries[obvSeries.length-1] - obvSeries[obvSeries.length-21];
    if (mom!==null) {
      if ((obvTrend>0 && mom>0) || (obvTrend<0 && mom<0)) obvS = 12; // volume confirme la tendance
      else if ((obvTrend>0 && mom<0) || (obvTrend<0 && mom>0)) obvS = 2; // divergence volume/prix
      else obvS = 6;
    }
  }
  const total = Math.max(0,Math.min(100, Math.round(trend+rsiS+macdS+momS+volS+perS+relS+obvS)));
  return { total, breakdown:[
    {label:'Tendance (prix vs SMA20/50)', value:Math.round(trend), max:18},
    {label:'RSI (14)', value:Math.round(rsiS), max:13},
    {label:'MACD', value:Math.round(macdS), max:13},
    {label:'Momentum (20 périodes)', value:Math.round(momS), max:13},
    {label:'Volatilité (stabilité)', value:Math.round(volS), max:9},
    {label:'PER', value:Math.round(perS), max:13},
    {label:'Performance vs indice', value:Math.round(relS), max:9},
    {label:'Volume (OBV)', value:Math.round(obvS), max:12},
  ], raw:{last,s20,s50,r,m,vol,mom,per,relMom,macdTrend,obvTrend} };
}

async function searchSymbols(q) {
  if (!apiKey || q.length<2) return;
  const key = q.toLowerCase();
  const cached = cacheGet('search_'+key, TTL.search);
  const dl = document.getElementById('ticker-suggestions');
  if (cached) { dl.innerHTML = cached.map(s => `<option value="${s.symbol}">${s.name||''}</option>`).join(''); return; }
  try {
    const res = await fetch(`https://api.twelvedata.com/symbol_search?symbol=${encodeURIComponent(q)}&apikey=${apiKey}`);
    const data = await res.json();
    const list = (data.data||[]).slice(0,8).map(s => ({symbol:s.symbol, name:s.instrument_name||''}));
    cacheSet('search_'+key, list);
    dl.innerHTML = list.map(s => `<option value="${s.symbol}">${s.name}</option>`).join('');
  } catch(e) { /* pas de suggestion, tant pis */ }
}
let searchTimer = null;
function debouncedSearch(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => searchSymbols(val), 400);
}
function attachAutocomplete(ids) {
  ids.forEach(id => {
    const input = document.getElementById(id);
    if (input) input.addEventListener('input', (e) => debouncedSearch(e.target.value));
  });
}

// ---- API Twelve Data ----
async function fetchQuote(symbol) {
  const cached = cacheGet('quote_'+symbol, TTL.quote);
  if (cached) return cached;
  const res = await fetch(`https://api.twelvedata.com/quote?symbol=${encodeURIComponent(symbol)}&apikey=${apiKey}`);
  const data = await res.json();
  if (data.status === 'error' || data.code) throw new Error(data.message || 'Erreur API');
  cacheSet('quote_'+symbol, data);
  return data;
}
async function fetchSeries(symbol) {
  const cached = cacheGet('series_'+symbol, TTL.series);
  if (cached) return cached;
  const res = await fetch(`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(symbol)}&interval=1day&outputsize=250&apikey=${apiKey}`);
  const data = await res.json();
  if (data.status === 'error' || data.code) throw new Error(data.message || 'Erreur API');
  const values = [...data.values].reverse();
  const result = { closes: values.map(v => parseFloat(v.close)), volumes: values.map(v => parseFloat(v.volume)) };
  cacheSet('series_'+symbol, result);
  return result;
}

async function fetchPriceOnDate(symbol, dateStr) {
  const key = 'histprice_'+symbol+'_'+dateStr;
  const cached = cacheGet(key, Infinity); // historique immuable : cache permanent
  if (cached) return cached;
  const startDate = new Date(dateStr); startDate.setDate(startDate.getDate()-7);
  const start = startDate.toISOString().slice(0,10);
  const res = await fetch(`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(symbol)}&interval=1day&start_date=${start}&end_date=${dateStr}&apikey=${apiKey}`);
  const data = await res.json();
  if (data.status === 'error' || data.code) throw new Error(data.message || 'Erreur API');
  if (!data.values || !data.values.length) throw new Error(`Aucun cours trouvé pour ${symbol} autour du ${dateStr} (marché fermé ou ticker invalide).`);
  const result = {
    price: parseFloat(data.values[0].close),
    actualDate: data.values[0].datetime,
    currency: data.meta && data.meta.currency ? data.meta.currency : null,
  };
  cacheSet(key, result);
  return result;
}

// ---- Assistant de décision ----
function scoreTone(score) {
  if (score >= 65) return { label:'Renforcer', cls:'buy' };
  if (score >= 50) return { label:'Conserver', cls:'hold' };
  if (score >= 40) return { label:'Surveiller', cls:'watch' };
  return { label:'Réévaluer', cls:'sell' };
}
function decisionFor(ticker, agg) {
  const price = prices[ticker] ?? agg.pru;
  const perf = agg.pru ? (price - agg.pru) / agg.pru * 100 : 0;
  const plan = tickerMeta[ticker] || {};
  const score = tickerScores[ticker]?.total;
  const stop = parseFloat(plan.stop), target = parseFloat(plan.target);
  if (Number.isFinite(stop) && price <= stop) return { ticker, kind:'Réduire / protéger', cls:'sell', priority:1, text:`Cours ${fmt(price)} sous votre seuil de protection (${fmt(stop)}). Vérifiez votre scénario avant la prochaine séance.`, score, perf };
  if (Number.isFinite(target) && price >= target) return { ticker, kind:'Objectif atteint', cls:'buy', priority:2, text:`Cours ${fmt(price)} au-dessus de votre objectif (${fmt(target)}). Envisagez de sécuriser une partie des gains.`, score, perf };
  if (score !== undefined && score < 40 && perf < -8) return { ticker, kind:'Réévaluer', cls:'sell', priority:1, text:`Score faible (${score}/100) et position à ${fmt(perf,1)}%. Revoyez la thèse, le risque et votre seuil de sortie.`, score, perf };
  if (score !== undefined && score < 40) return { ticker, kind:'Surveiller', cls:'watch', priority:2, text:`Le momentum et/ou la tendance sont fragiles (score ${score}/100). Pas de renforcement avant amélioration.`, score, perf };
  if (score !== undefined && score >= 65 && perf < 5) return { ticker, kind:'Renforcement possible', cls:'buy', priority:3, text:`Signal technique constructif (${score}/100) avec une position encore proche de son prix moyen. À calibrer selon votre allocation.`, score, perf };
  return { ticker, kind: score === undefined ? 'Analyse à lancer' : 'Conserver', cls: score === undefined ? 'watch' : 'hold', priority:3, text: score === undefined ? 'Lancez une analyse pour disposer de signaux de tendance, momentum et volume.' : `Score ${score}/100 · position à ${fmt(perf,1)}%. Continuez à suivre votre scénario d’investissement.`, score, perf };
}
function renderAssistant() {
  const el = document.getElementById('tab-assistant');
  if (!el) return;
  const { tickers, aggs, totalValue, totalCostBasis } = computeTotals();
  const decisions = tickers.map(t => decisionFor(t, aggs[t])).sort((a,b)=>a.priority-b.priority);
  const scoredWatch = watchlist.map(w => ({ ...w, score:tickerScores[w.ticker]?.total })).filter(w => w.score !== undefined).sort((a,b)=>b.score-a.score);
  const candidates = scoredWatch.filter(w=>w.score>=60).slice(0,3);
  const largest = tickers.map(t => ({ ticker:t, value:aggs[t].qty*(prices[t]??aggs[t].pru)*rateFor(t) })).sort((a,b)=>b.value-a.value)[0];
  const concentration = largest && totalValue ? largest.value/totalValue*100 : 0;
  const pnl = totalValue-totalCostBasis;
  const analysisCount = tickers.filter(t => tickerScores[t]?.total !== undefined).length;
  const colors=['#378add','#6457a6','#0f6e56','#c77c02','#a32d2d','#777'];
  el.innerHTML = `
    <div class="card hero">
      <div class="row"><div><div class="muted-text">VOTRE CO-PILOTE D’INVESTISSEMENT</div><div style="font-size:22px;font-weight:750;margin-top:3px">Aujourd’hui, priorisez l’essentiel.</div></div><div style="font-size:25px">◈</div></div>
      <div class="stat-grid" style="margin-top:16px">
        <div class="stat"><span class="muted-text">Portefeuille</span><strong>${fmt(totalValue)} €</strong></div>
        <div class="stat"><span class="muted-text">P&L latent</span><strong class="${pnl>=0?'green':'red'}">${pnl>=0?'+':''}${fmt(pnl)} €</strong></div>
        <div class="stat"><span class="muted-text">Profil</span><strong>${investorProfile.risk}</strong></div>
      </div>
    </div>

let usdEurRate = store.get('usdEurRate', null);
function rateFor(ticker) { return (tickerMeta[ticker]?.currency === 'USD' && usdEurRate) ? usdEurRate : 1; }
function symFor(ticker) { return tickerMeta[ticker]?.currency === 'USD' ? '$' : '€'; }

function txForTicker(ticker) {
  return transactions.filter(t=>t.ticker===ticker).sort((a,b)=> a.date.localeCompare(b.date) || a.id-b.id);
}
function computeAgg(ticker) {
  let qty=0, pru=0, realized=0;
  txForTicker(ticker).forEach(tx => {
    if (tx.type==='buy') { pru = (qty+tx.qty)>0 ? (qty*pru + tx.qty*tx.price)/(qty+tx.qty) : tx.price; qty += tx.qty; }
    else { realized += (tx.price - pru) * tx.qty; qty = Math.max(0, qty - tx.qty); }
  });
  return { qty, pru, realized };
}
function allTickers() { return [...new Set(transactions.map(t=>t.ticker))]; }

function computeTotals() {
  const tickers = allTickers();
  let totalValue=0, totalCostBasis=0, totalRealized=0;
  const aggs = {};
  tickers.forEach(t => {
    const agg = computeAgg(t); aggs[t]=agg;
    const rate = rateFor(t); const price = prices[t] ?? agg.pru;
    totalValue += agg.qty*price*rate;
    totalCostBasis += agg.qty*agg.pru*rate;
    totalRealized += agg.realized*rate;
  });
  return { tickers, aggs, totalValue, totalCostBasis, totalRealized };
}

// TRI (XIRR) : rendement annualisé réel tenant compte des dates de chaque transaction —
// contrairement au PRU pondéré qui ignore la durée de détention.
function daysBetween(d1, d2) { return (new Date(d2) - new Date(d1)) / 86400000; }
function xnpv(rate, flows) {
  const d0 = flows[0].date;
  return flows.reduce((sum,f)=> sum + f.amount / Math.pow(1+rate, daysBetween(d0,f.date)/365), 0);
}
function xirr(flows) {
  if (flows.length < 2) return null;
  let rate = 0.1;
  for (let i=0;i<60;i++) {
    const npv = xnpv(rate, flows);
    const d = (xnpv(rate+1e-5, flows) - npv) / 1e-5;
    if (Math.abs(d) < 1e-9) return null;
    const next = rate - npv/d;
    if (!Number.isFinite(next) || next < -0.99) return null;
    if (Math.abs(next-rate) < 1e-7) return next;
    rate = next;
  }
  return null;
}
function computeXirr() {
  const flows = transactions.map(tx => ({
    date: tx.date,
    amount: (tx.type==='buy' ? -1 : 1) * tx.qty * tx.price * rateFor(tx.ticker)
  })).sort((a,b)=>a.date.localeCompare(b.date));
  const { totalValue } = computeTotals();
  if (!flows.length || totalValue<=0) return null;
  flows.push({ date: new Date().toISOString().slice(0,10), amount: totalValue });
  return xirr(flows);
}

// Historique de la valeur totale (un point par jour)
let valueHistory = store.get('valueHistory', []);
function snapshotValue() {
  const { totalValue } = computeTotals();
  if (totalValue<=0) return;
  const today = new Date().toISOString().slice(0,10);
  const idx = valueHistory.findIndex(h=>h.date===today);
  if (idx>=0) valueHistory[idx].value = totalValue; else valueHistory.push({date:today, value:totalValue});
  valueHistory = valueHistory.slice(-180);
  store.set('valueHistory', valueHistory);
}
function historySvg() {
  if (valueHistory.length<2) return '';
  const w=440,h=100,pad=4;
  const vals = valueHistory.map(x=>x.value);
  const min=Math.min(...vals), max=Math.max(...vals);
  const range = (max-min)||1;
  const pts = valueHistory.map((pt,i)=> {
    const x = pad + i*(w-2*pad)/(valueHistory.length-1);
    const y = h-pad - ((pt.value-min)/range)*(h-2*pad);
    return `${x},${y}`;
  }).join(' ');
  const up = vals[vals.length-1] >= vals[0];
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    <polyline points="${pts}" fill="none" stroke="${up?'#0f6e56':'#a32d2d'}" stroke-width="2"/>
  </svg>`;
}

  if (!apiKey) { tickerScores[t] = { error: "Ajoutez d'abord une clé API dans l'onglet dédié." }; renderPortfolio(); renderWatch(); renderAssistant(); return; }
  scoreLoading[t] = true; renderPortfolio(); renderWatch(); renderAssistant();
  try {

    const series = await fetchSeries(t);
    if (series.closes.length < 15) throw new Error('Pas assez de données renvoyées par l\'API.');
    if (!seriesWasCached) await new Promise(r=>setTimeout(r,1200));
    if (!benchmarkCache) {
      const benchWasCached = !!cacheGet('series_SPY', TTL.series);
      try { benchmarkCache = await fetchSeries('SPY'); if (!benchWasCached) await new Promise(r=>setTimeout(r,1200)); } catch(e) { benchmarkCache = null; }
    }
    const per = tickerMeta[t]?.per ? parseFloat(tickerMeta[t].per) : null;
    tickerScores[t] = computeScore(series.closes, { per, benchmarkArr: benchmarkCache ? benchmarkCache.closes : null, volumes: series.volumes });
  } catch (e) {
    tickerScores[t] = { error: e.message };
  }
  scoreLoading[t] = false;
  renderPortfolio(); renderWatch(); renderAssistant();
}

window.addTransaction = async () => {
  const t = document.getElementById('p-ticker').value.trim().toUpperCase();
  const type = document.getElementById('p-type').value;
  const date = document.getElementById('p-date').value;
  const amountInput = document.getElementById('p-amount').value.trim();
  const qtyInput = document.getElementById('p-qty').value.trim();
  const priceInput = document.getElementById('p-price').value.trim();
  if (!t || !date) { alert('Ticker et date obligatoires.'); return; }
  if (!amountInput && !qtyInput) { alert('Renseignez au moins le montant investi ou la quantité.'); return; }

  const btn = document.getElementById('p-submit');
  let price, currency, actualDate = null;
  const manualPrice = priceInput ? parseFloat(priceInput.replace(',','.')) : null;

  if (manualPrice) {
    price = manualPrice;
    currency = tickerMeta[t]?.currency || null;
  } else {
    if (!apiKey) { alert("Ajoutez une clé API (onglet Config) pour récupérer automatiquement le cours, ou renseignez le prix manuellement."); return; }
    btn.disabled = true; btn.textContent = 'Récupération du cours…';
    try {
      const hist = await fetchPriceOnDate(t, date);
      price = hist.price; actualDate = hist.actualDate;
      currency = tickerMeta[t]?.currency || hist.currency || 'EUR';
    } catch (e) {
      alert(e.message); btn.disabled = false; btn.textContent = '+ Ajouter la transaction'; return;
    }
    btn.disabled = false; btn.textContent = '+ Ajouter la transaction';
  }

  let qty, amount;
  if (qtyInput) { qty = parseFloat(qtyInput.replace(',','.')); amount = qty*price; }
  else { amount = parseFloat(amountInput.replace(',','.')); qty = amount/price; }

  if (type==='sell') {
    const agg = computeAgg(t);
    if (qty > agg.qty + 1e-9) { alert(`Vous ne détenez que ${fmt(agg.qty,4)} ${t}, impossible de vendre ${fmt(qty,4)}.`); return; }
  }
  transactions.push({ id: Date.now(), ticker:t, type, qty, price, date });
  if (!tickerMeta[t]) tickerMeta[t] = { currency: currency || 'EUR' };
  store.set('transactions', transactions); store.set('tickerMeta', tickerMeta); scheduleSync();
  document.getElementById('p-ticker').value=''; document.getElementById('p-amount').value=''; document.getElementById('p-qty').value=''; document.getElementById('p-price').value='';
  renderPortfolio(); renderAssistant();
  const sym = (tickerMeta[t]?.currency)==='USD' ? '$' : '€';
  alert(`${type==='buy'?'Achat':'Vente'} enregistré : ${fmt(qty,4)} action(s) à ${fmt(price)} ${sym}${actualDate && actualDate!==date ? ` (cours du ${actualDate}, marché fermé le ${date})` : ''}.`);
};

window.refreshPrices = async () => {
  if (!apiKey) { renderPortfolio("Ajoutez d'abord une clé API dans l'onglet dédié."); return; }
  renderPortfolio('loading');
  const delay = (ms) => new Promise(r=>setTimeout(r,ms));
  const tickers = allTickers();
  let failed = [];
  if (tickers.some(t=>tickerMeta[t]?.currency==='USD')) {
    const cachedRate = cacheGet('rate_USDEUR', TTL.rate);
    if (cachedRate) { usdEurRate = cachedRate; store.set('usdEurRate', usdEurRate); }
    else {
      try {
        const res = await fetch(`https://api.twelvedata.com/exchange_rate?symbol=USD/EUR&apikey=${apiKey}`);
        const data = await res.json();
        if (!(data.status==='error'||data.code) && Number.isFinite(parseFloat(data.rate))) {
          usdEurRate = parseFloat(data.rate); store.set('usdEurRate', usdEurRate); cacheSet('rate_USDEUR', usdEurRate);
        } else failed.push('taux USD→EUR');
      } catch(e) { failed.push('taux USD→EUR'); }
      await delay(1200);
    }
  }
  for (const t of tickers) {
    const cachedQuote = cacheGet('quote_'+t, TTL.quote);
    if (cachedQuote) { const price = parseFloat(cachedQuote.close); if (Number.isFinite(price)) prices[t]=price; continue; }
    try {
      const q = await fetchQuote(t);
      const price = parseFloat(q.close);
      if (Number.isFinite(price)) prices[t] = price;
    } catch (e) { failed.push(t); }
    await delay(1200);
  }
  store.set('prices', prices);
  snapshotValue();
  scheduleSync();
  renderPortfolio(failed.length ? `Échec pour : ${failed.join(', ')}` : 'Prix à jour.'); renderAssistant();
};

        <div>SMA20 : ${fmt(result.raw.s20)} · SMA50 : ${fmt(result.raw.s50)}</div>
        <div>RSI(14) : ${result.raw.r!==null?fmt(result.raw.r,1):'—'}</div>
        <div>MACD hist. : ${result.raw.m?fmt(result.raw.m.hist,3):'—'} ${result.raw.macdTrend ? (result.raw.macdTrend>0?'↗ en hausse (5 séances)':'↘ en baisse (5 séances)') : ''}</div>
        <div>Momentum 20p : ${result.raw.mom!==null?fmt(result.raw.mom,1)+'%':'—'}</div>
        <div>Volatilité annualisée : ${result.raw.vol!==null?fmt(result.raw.vol,1)+'%':'—'}</div>
        <div>PER utilisé : ${result.raw.per!==null?fmt(result.raw.per,1):'— (neutre)'}</div>
        <div>Perf. relative vs indice (20p) : ${result.raw.relMom!==null?fmt(result.raw.relMom,1)+' pts':'— (neutre)'}</div>
        <div>Volume (OBV, 20p) : ${result.raw.obvTrend!==null?(result.raw.obvTrend>0?'↗ en accumulation':'↘ en distribution'):'— (données volume indisponibles)'}</div>
      </div>` : ''}`;
  attachAutocomplete(['a-ticker','a-bench']);
}
let lastResult = null;
window.runLive = async () => {
  const ticker = document.getElementById('a-ticker').value.trim();
  const perInput = document.getElementById('a-per').value.trim();
  const bench = document.getElementById('a-bench').value.trim() || 'SPY';
  if (!ticker) return;
  store.set('lastTicker', ticker); store.set('lastPer', perInput); store.set('lastBench', document.getElementById('a-bench').value.trim());
  if (!apiKey) { renderAnalyse(null, 'Ajoutez d\'abord une clé API dans l\'onglet dédié.', false); return; }
  renderAnalyse(null, '', true);
  try {
    const seriesWasCached = !!cacheGet('series_'+ticker, TTL.series);
    const series = await fetchSeries(ticker);
    if (series.closes.length < 15) throw new Error('Pas assez de données renvoyées par l\'API.');
    if (!seriesWasCached) await new Promise(r=>setTimeout(r,1200));
    let benchSeries = null;
    const benchWasCached = !!cacheGet('series_'+bench, TTL.series);
    try { benchSeries = await fetchSeries(bench); if (!benchWasCached) await new Promise(r=>setTimeout(r,1200)); } catch(e) { /* comparaison indisponible, on reste neutre */ }
    const per = perInput ? parseFloat(perInput.replace(',','.')) : null;
    const score = computeScore(series.closes, { per, benchmarkArr: benchSeries ? benchSeries.closes : null, volumes: series.volumes });
    lastResult = { ...score, ticker };
    renderAnalyse(lastResult, '', false);
  } catch (e) {
    renderAnalyse(null, e.message, false);
  }
};

// ---- Watchlist ----
function renderWatch() {
  const el = document.getElementById('tab-watch');
  const grouped = watchlist.reduce((acc,w)=>{ (acc[w.theme]=acc[w.theme]||[]).push(w); return acc; }, {});
  el.innerHTML = `
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px">Ajouter à la watchlist</div>
      <input id="w-ticker" list="ticker-suggestions" placeholder="Ticker"/>
      <input id="w-theme" placeholder="Thème / secteur"/>
      <input id="w-note" placeholder="Note"/>
      <button onclick="addWatch()">+ Ajouter</button>
    </div>
    ${Object.keys(grouped).length===0 ? `<div class="muted-text" style="text-align:center;padding:2rem 0">Aucune suggestion automatique — classez vous-même les actions que vous suivez.</div>` : ''}
    ${Object.entries(grouped).map(([theme,items]) => `
      <div class="card">
        <div style="font-weight:600;margin-bottom:8px;color:var(--accent)">${theme}</div>
        ${items.map(w => `
          <div style="margin-bottom:10px;padding-bottom:10px;border-bottom:0.5px solid var(--border)">
            <div class="row" style="align-items:start">
              <div><div style="font-weight:600;font-size:14px">${w.ticker}</div>${w.note?`<div class="muted-text">${w.note}</div>`:''}</div>
              <button class="del" onclick="removeWatch(${w.id})">✕</button>
            </div>
            <div class="row" style="margin-top:6px;gap:6px">
              <input placeholder="PER (opt.)" style="margin:0" value="${tickerMeta[w.ticker]?.per||''}" onchange="setTickerPer('${w.ticker}', this.value)"/>
              <button style="width:auto;white-space:nowrap;margin:0" onclick="calcTickerScore('${w.ticker}')" ${scoreLoading[w.ticker]?'disabled':''}>${scoreLoading[w.ticker]?'…':(tickerScores[w.ticker]&&!tickerScores[w.ticker].error?'↻ Score':'Calculer le score')}</button>
            </div>
            ${tickerScores[w.ticker] ? (tickerScores[w.ticker].error
              ? `<div class="red" style="font-size:12px;margin-top:4px">${tickerScores[w.ticker].error}</div>`
              : `<div class="row" style="margin-top:6px;align-items:center">
                   <span class="muted-text" style="font-size:12px">Score technique</span>
                   <span style="font-weight:700;font-size:16px;color:${tickerScores[w.ticker].total>=60?'#0f6e56':tickerScores[w.ticker].total>=40?'#b8860b':'#a32d2d'}">${tickerScores[w.ticker].total}/100</span>
                 </div>`) : ''}
          </div>`).join('')}
      </div>`).join('')}`;
  attachAutocomplete(['w-ticker']);
}
window.addWatch = () => {
  const t = document.getElementById('w-ticker').value, th = document.getElementById('w-theme').value, n = document.getElementById('w-note').value;
  if (!t) return;
  watchlist.push({id:Date.now(), ticker:t.toUpperCase(), theme: th||'Non classé', note:n});
  store.set('watchlist', watchlist); scheduleSync(); renderWatch(); renderAssistant();
};
window.removeWatch = (id) => {
  const w = watchlist.find(x=>x.id===id);
  if (!confirm(`Retirer ${w ? w.ticker : 'cet élément'} de la watchlist ?`)) return;
  watchlist = watchlist.filter(w=>w.id!==id); store.set('watchlist', watchlist); scheduleSync(); renderWatch(); renderAssistant();
};

// ---- Config ----
function renderConfig() {
  const el = document.getElementById('tab-config');
  const cacheCount = Object.keys(localStorage).filter(k=>k.startsWith('cache_')).length;
  el.innerHTML = `
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px">Mon cadre d’investissement</div>
      <div class="muted-text" style="margin-bottom:8px">Ces repères aident l’assistant à contextualiser vos signaux. Ils ne remplacent pas votre propre analyse.</div>
      <div class="grid2"><select id="i-risk"><option ${investorProfile.risk==='Prudent'?'selected':''}>Prudent</option><option ${investorProfile.risk==='Équilibré'?'selected':''}>Équilibré</option><option ${investorProfile.risk==='Dynamique'?'selected':''}>Dynamique</option></select><select id="i-horizon"><option ${investorProfile.horizon==='1–3 ans'?'selected':''}>1–3 ans</option><option ${investorProfile.horizon==='5 ans'?'selected':''}>5 ans</option><option ${investorProfile.horizon==='10 ans et +'?'selected':''}>10 ans et +</option></select></div>
      <input id="i-cash" inputmode="decimal" placeholder="Liquidités disponibles (€)" value="${investorProfile.cash||''}"/>
      <button onclick="saveInvestorProfile()">Enregistrer mon profil</button>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px">Clé API Twelve Data</div>
      <div class="muted-text" style="margin-bottom:8px">Créez un compte gratuit sur twelvedata.com pour obtenir une clé. Plan gratuit : ~8 requêtes/minute. La clé est stockée uniquement sur votre téléphone (localStorage), jamais envoyée ailleurs qu'à Twelve Data.</div>
      <input id="c-key" placeholder="Votre clé API" value="${apiKey}"/>
      <button onclick="saveKey()">Enregistrer</button>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px">Cache local</div>
      <div class="muted-text" style="margin-bottom:8px">Les prix (15 min), séries de cours (1h), taux de change (1h) et recherches de tickers (10 min) sont mis en cache sur votre téléphone pour économiser des appels API. ${cacheCount} entrée(s) actuellement.</div>
      <button onclick="if(confirm('Vider le cache ? Les prochaines actions referont des appels API frais.')){clearCache();renderConfig();}">Vider le cache</button>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px">Synchronisation multi-appareils</div>
      ${!fbConfig ? `
        <div class="muted-text" style="margin-bottom:8px">Collez ici l'objet <code>firebaseConfig</code> copié depuis la console Firebase (Paramètres du projet → Vos applications).</div>
        <textarea id="fb-config" rows="4" placeholder='{"apiKey":"...", "authDomain":"...", "projectId":"...", ...}'></textarea>
        <button onclick="saveFbConfig()">Enregistrer la configuration</button>
      ` : !cloudUser ? `
        <div class="muted-text" style="margin-bottom:8px">Connectez-vous (même compte sur tous vos appareils pour partager les données).</div>
        <input id="fb-email" placeholder="Email" type="email"/>
        <input id="fb-pass" placeholder="Mot de passe" type="password"/>
        <div class="grid2">
          <button onclick="cloudSignIn()">Se connecter</button>
          <button onclick="cloudSignUp()">Créer un compte</button>
        </div>
      ` : `
        <div class="muted-text" style="margin-bottom:8px">Connecté : ${cloudUser.email}</div>
        <button onclick="cloudSignOut()">Se déconnecter</button>
      `}
      ${syncStatus ? `<div class="muted-text" style="margin-top:8px">${syncStatus}</div>` : ''}
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px">Sauvegarde (export / import)</div>
      <div class="muted-text" style="margin-bottom:8px">${cloudUser ? 'Vos données sont synchronisées automatiquement. Gardez tout de même un export ponctuel en filet de secours.' : 'Vos données ne vivent que sur cet appareil (ou sont synchronisées si activé ci-dessus). Exportez-les régulièrement pour ne rien perdre.'}</div>
      <button onclick="exportData()">↓ Exporter mes données</button>
      <textarea id="export-out" rows="4" placeholder="Le JSON exporté apparaîtra ici — copiez-le et gardez-le en lieu sûr (Notes, email, etc.)" style="font-size:11px" readonly></textarea>
      <div style="height:8px"></div>
      <textarea id="import-in" rows="4" placeholder="Collez ici un JSON précédemment exporté pour restaurer vos données"></textarea>
      <button onclick="importData()">↑ Importer (remplace les données actuelles)</button>
    </div>`;
}
window.saveKey = () => { apiKey = document.getElementById('c-key').value.trim(); store.set('apiKey', apiKey); renderConfig(); };
window.saveInvestorProfile = () => {
  investorProfile = { risk:document.getElementById('i-risk').value, horizon:document.getElementById('i-horizon').value, cash:parseFloat(document.getElementById('i-cash').value.replace(',','.'))||0 };
  store.set('investorProfile', investorProfile); scheduleSync(); renderConfig(); renderAssistant();
};
window.exportData = () => {
  const payload = { version:2, exportedAt: new Date().toISOString(), transactions, tickerMeta, prices, watchlist, investorProfile };
  const json = JSON.stringify(payload, null, 2);
  document.getElementById('export-out').value = json;
  try {
    const blob = new Blob([json], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `invest-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  } catch(e) { /* le téléchargement peut échouer en PWA — le texte ci-dessus reste le filet de secours */ }
};
window.importData = () => {
  const raw = document.getElementById('import-in').value.trim();
  if (!raw) return;
  let data;
  try { data = JSON.parse(raw); } catch(e) { alert('JSON invalide.'); return; }
  if (!Array.isArray(data.transactions)) { alert('Format non reconnu — ce fichier ne semble pas être une sauvegarde de cet outil.'); return; }
  if (!confirm('Ceci remplace TOUTES vos données actuelles (transactions, watchlist, prix) par celles du fichier importé. Continuer ?')) return;
  transactions = data.transactions || [];
  tickerMeta = data.tickerMeta || {};
  prices = data.prices || {};
  watchlist = data.watchlist || [];
  investorProfile = data.investorProfile || investorProfile;
  store.set('transactions', transactions); store.set('tickerMeta', tickerMeta); store.set('prices', prices); store.set('watchlist', watchlist); store.set('investorProfile', investorProfile);
  scheduleSync();
  document.getElementById('import-in').value = '';
  renderPortfolio(); renderWatch(); renderAssistant(); renderConfig();
  alert('Import terminé.');
};

// ---- Tabs ----
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    store.set('lastTab', btn.dataset.tab);
    ['assistant','portfolio','analyse','watch','config'].forEach(t => document.getElementById('tab-'+t).style.display = t===btn.dataset.tab ? 'block':'none');
  });
});

renderAssistant(); renderPortfolio(); renderAnalyse(null,'',false); renderWatch(); renderConfig();
initFirebase();

const initialTab = store.get('lastTab', 'assistant');
document.querySelectorAll('.tab').forEach(b => {
  const isActive = b.dataset.tab === initialTab;
  b.classList.toggle('active', isActive);
  document.getElementById('tab-'+b.dataset.tab).style.display = isActive ? 'block' : 'none';
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
